        <h1>Routines Quotidiennes Gratuites — Daily Routines</h1>
        <p>
          L'application PWA gratuite pour créer tes routines quotidiennes,
          suivre tes habitudes et maintenir ta série. Disponible sur iPhone (iOS
          16.4+), Android et navigateur. Sans abonnement, sans publicité.
        </p>

        <h2>Fonctionnalités</h2>
        <ul>
          <li>
            <strong>Routines quotidiennes et hebdomadaires</strong> — crée des
            routines avec durée et créneau horaire (Matin, Après-midi, Soir)
          </li>
          <li>
            <strong>Streak et statistiques</strong> — suis ta série de jours
            consécutifs avec calendrier heatmap et taux de complétion
          </li>
          <li>
            <strong>Timer plein écran</strong> — minuteur immersif avec
            progression circulaire pour rester focus
          </li>
          <li>
            <strong>Notifications push</strong> — rappels intelligents sur
            iPhone et Android, même app fermée
          </li>
          <li>
            <strong>Tâches et dossiers</strong> — organise tes projets en
            dossiers avec deadlines et calendrier intégré
          </li>
          <li>
            <strong>Jours de repos</strong> — marque un jour de repos sans
            perdre ta série
          </li>
        </ul>

        <h2>L'Éveil — protection de streak hebdomadaire</h2>
        <p>
          L'Éveil est une protection de streak consommable, rechargeable chaque
          semaine (lundi). Si tu rates un jour et que ta série se casse, active
          l'Éveil pour couvrir ce jour manqué — rétroactivement ou
          préventivement. Ton streak repart comme si de rien n'était.
        </p>

        <h2>Questions fréquentes</h2>
        <h3>C'est une appli ou un site web ?</h3>
        <p>
          Les deux. Daily Routines est une PWA (Progressive Web App) : elle
          s'installe sur ton téléphone comme une vraie appli, sans passer par
          l'App Store. Rapide, légère, toujours à jour.
        </p>

        <h3>C'est quoi l'Éveil ?</h3>
        <p>
          L'Éveil est une seconde chance hebdomadaire. Si tu rates un jour et
          que ta série se casse, tu peux activer l'Éveil pour couvrir ce jour
          manqué — une fois par semaine. Ton streak repart comme si de rien
          n'était.
        </p>

        <h3>Mes données sont-elles privées ?</h3>
        <p>
          Oui. Tes routines et statistiques sont stockées de manière sécurisée.
          Aucune donnée n'est revendue ou partagée. Tu peux supprimer ton compte
          à tout moment.
        </p>

        <h3>Les notifications push marchent sur iPhone ?</h3>
        <p>
          Oui, depuis iOS 16.4. Il faut installer l'app via Safari (Partager →
          Sur l'écran d'accueil), puis accepter les notifications depuis l'app.
        </p>
